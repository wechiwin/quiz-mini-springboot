<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Studiamo l'italiano</title>
    <link rel="stylesheet"
          th:href="@{/static/css/header.css(__${#dates.format(#dates.createNow(), 'yyyyMMddHHmmss')}__)}">
    <script type="text/javascript" th:src="@{/static/js/jquery.min.js}"></script>
    <script type="text/javascript" th:src="@{/static/js/vue@2.6.20.min.js}"></script>
    <script th:src="@{/static/js/components/HeaderComponent.js(__${#dates.format(#dates.createNow(), 'yyyyMMddHHmmss')}__)}"></script>
</head>

<body>
<div id="app">
    <header-component
            :base-path="'/quiz'"
            @toggle-dark="toggleDarkMode"
            @to-manage="handleToManage"
    ></header-component>
    <button class="random-button">
        random
    </button>

    <div id="folderList" class="list-content">
        <div v-for="folder in list" :key="folder.foPkid">
            <button class="list-item"
                    @click="handleClickFolder(folder)"
                    :style="{ '--fill-percent': folder.percentage }"
                    :class="{ 'filled': true, 'hover-show-rename': folder.percentage === '100%' }">
                <span class="folder-name foName">{{ folder.foName }}</span>
                <span class="folder-name reStudy">重新学习</span>
            </button>
        </div>
    </div>

</div>
</div>

<!-- 国际化注入 -->
<script th:inline="javascript">
    window.ThymeleafMessages = {
        'index.title': /*[[#{index.title}]]*/ 'Studiamo!',
        'index.manage': /*[[#{index.manage}]]*/ 'Manage'
    };
</script>

<script type="text/javascript">
    function toggleDarkMode() {
        const currentMode = localStorage.getItem('mode') || 'dark';
        const newMode = currentMode === 'dark' ? 'light' : 'dark';
        document.documentElement.classList.toggle('dark-mode');
        localStorage.setItem('mode', newMode);
    }

    var getList = function () {
        var _this = this;
        var param = {
            foName: ""
        };
        $.ajax({
            type: "POST",
            url: "/quiz/folder/searchList",
            data: JSON.stringify(param),
            dataType: "json",
            contentType: "application/json",
            success: function (result) {
                if (result.status == 200) {
                    console.log(result)
                    const convertedArray = result.data.map(item => ({
                        ...item,
                        percentage: `${(item.percentage * 100).toFixed(0)}%`
                    }));
                    _this.list = convertedArray;
                    console.log('percentage',convertedArray)
                }
            },
            error: (error) => {
                alert(error.responseJSON.message)
                console.log('Error:', error);
            }
        });
    }
    new Vue({
        el: '#app',
        data() {
            return {
                list: [],
                searchList: '',
                selectedLanguage: this.getCookie('ClientLanguage') || 'zh_CN',  // 默认语言为英语,
                isSidebarOpen: false,
            }
        },
        mounted() {
            this.handleDark()
            this.getList();
        },
        methods: {
            toggleSidebar() {
                this.isSidebarOpen = !this.isSidebarOpen;
            },
            changeLanguage(selectedLanguage) {
                window.location.href = '/quiz/?lang=' + selectedLanguage
                this.setCookie('ClientLanguage', selectedLanguage, 365); // 设置 cookie 保持一年
            },
            // 获取 cookie
            getCookie(name) {
                let nameEQ = name + "=";
                let ca = document.cookie.split(';');
                for (let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                    if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
                }
                return null;
            },
            // 设置 cookie
            setCookie(name, value, days) {
                let expires = "";
                if (days) {
                    let date = new Date();
                    date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                    expires = "; expires=" + date.toUTCString();
                }
                document.cookie = name + "=" + (value || "") + expires + "; path=/";
            },
            handleClickFolder(folder) {
                if(folder.ifEmptyCards === 1){
                    console.log('relearn')
                }else{
                    window.location.href = '/quiz/portal/getFolder/' + folder.foPkid;
                }

            },
            handleDark() {
                let mode = localStorage.getItem('mode')
                if (!mode) {
                    localStorage.setItem('mode', 'light');
                } else if (mode === 'dark') {
                    document.documentElement.classList.toggle('dark-mode');
                }
            },
            handleToManage() {
                window.location.href = "/quiz/portal/manage";
            },
            getList: getList,
        }
    })
</script>
</body>

<style>
    /* Dracula Theme Colors */
    :root {
        --dracula-bg: #282a36;
        --dracula-fg: #f8f8f2;
        --dracula-comment: #6272a4;
        --dracula-blue: #2074a8;
    }

    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family: 'Arial', sans-serif;
        background-color: #f5f8fa;
        padding: 0;
    }

    button,
    select {
        padding: 10px 20px;
        margin: 10px;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        cursor: pointer;
        background-color: #1da1f2;
        color: #fff;
        transition: background-color 0.3s ease;
    }

    select option {
        background-color: #ffffff;
        color: #0e81d4;
    }

    .dark-mode select option {
        background-color: var(--dracula-bg);
        color: var(--dracula-fg);
    }

    button:hover,
    select:hover {
        background-color: #0e81d4;
    }

    .list-content {
        list-style-type: none;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start;
        flex-direction: column;
        height: 86vh;
        align-items: center;
        align-content: center;
        font-size: 18px;
    }

    .list-item {
        position: relative;
        display: flex;
        justify-content: space-around;
        align-items: center;
        width: 250px;
        line-height: 40px;
        cursor: pointer;
        padding: 10px 15px;
        margin: 10px;
        border: 1px solid #e1e8ed;
        border-radius: 5px;
        background-color: #ffffff;
        text-align: center;
        text-decoration: none;
        color: #000000;
        overflow: hidden;
        z-index: 1;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    /* 灌水伪元素 */
    .list-item::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 0%;
        background-color: rgba(100, 149, 237, 0.3);
        z-index: 0;
        transition: width 1s ease;
        pointer-events: none;
    }

    .list-item.filled::before {
        width: var(--fill-percent, 0%);
    }

    .list-item:hover::before {
        background-color: rgba(100, 149, 237, 0.5);
    }

    /* 文字层样式 */
    .folder-name {
        position: relative;
        z-index: 1;
        font-weight: 500;
    }

    .dark-mode .list-item {
        border: 1px solid #6272a4;
        background-color: #282a36;
        color: #f8f8f2;
    }

    .list-item:hover {
        outline: none;
        background-color: #ffffff;
        border: 1px solid #0e81d4;
    }

    .dark-mode .list-item:hover {
        background-color: #44475a;
    }

    @media screen and (max-width: 750px) {
        .list-content {
            flex-wrap: nowrap;
            margin-top: 4em;
        }

        .list-item {
            width: 18em;
        }
    }

    /* Dark Mode */
    .dark-mode body {
        background-color: var(--dracula-bg);
        color: var(--dracula-fg);
    }

    .dark-mode select {
        background-color: var(--dracula-bg);
        color: var(--dracula-fg);
        border: 1px solid var(--dracula-blue);
    }

    .dark-mode button {
        background-color: var(--dracula-bg);
        color: var(--dracula-fg);
        border: 1px solid var(--dracula-blue);
    }

    .dark-mode button:hover {
        background-color: var(--dracula-bg);
        color: var(--dracula-fg);
        border: 1px solid var(--dracula-blue);
    }

    .dark-mode select:hover {
        background-color: var(--dracula-bg);
        color: var(--dracula-fg);
        border: 1px solid var(--dracula-blue);
    }

    .dark-mode p {
        color: var(--dracula-fg);
    }
    /* 默认状态下隐藏“重新学习” */
    .reStudy {
        display: none;
    }

    /* 默认显示 folder.foName */
    .foName {
        display: inline;
    }

    /* 当按钮带有 hover-show-rename 类并且鼠标悬停时 */
    .hover-show-rename:hover .reStudy {
        display: inline;
    }

    .hover-show-rename:hover .foName {
        display: none;
    }

</style>
</html>
